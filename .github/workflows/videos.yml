# Rendert automatisch alle Videos aus dem Ordner "skripte" mit der guten Stimme.
# Ergebnis: im Tab "Actions" -> letzter Lauf -> unten "Artifacts" -> "tiktok-videos" herunterladen.
name: Videos erstellen

on:
  workflow_dispatch:          # per Knopf "Run workflow" starten
  push:
    paths:
      - "skripte/**"
      - "generator/**"
      - ".github/workflows/videos.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Programme installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          pip install -r generator/requirements.txt
      - name: Videos rendern
        run: python generator/make_video.py skripte --out videos
      - name: Videos zum Download bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-videos
          path: videos/
          retention-days: 30
