# Rendert die Videos aus "skripte" und "skripte_obst" mit der guten Stimme.
# Ergebnis: Tab "Actions" -> letzter Lauf -> unten "Artifacts" herunterladen
#   videos-skripte       = Brainrot-Geschichten (Ball-Animation)
#   videos-skripte_obst  = Obst-Underdog-Rennen
#   videos-skripte_block = Klötzchen-Storytime ("In dieser Stadt ... Huss. Huss. Huss.")
#   videos-ki_videos     = KI-Frucht-Storys aus deinen Clips
name: Videos erstellen

on:
  workflow_dispatch:          # per Knopf "Run workflow" starten (rendert alles)
  push:
    paths:
      - "skripte/**"
      - "skripte_obst/**"
      - "ki_videos/**"
      - "skripte_block/**"
      - "generator/**"
      - ".github/workflows/videos.yml"

permissions:
  contents: write             # damit die fertigen Videos ins Repo gelegt werden dürfen

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ordner: [skripte, skripte_obst, skripte_block, ki_videos]   # alle Ordner gleichzeitig
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Programme installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          pip install -r generator/requirements.txt
      - name: Herausfinden, welche Skripte neu sind
        id: auswahl
        env:
          VORHER: ${{ github.event.before }}
          EREIGNIS: ${{ github.event_name }}
          ORDNER: ${{ matrix.ordner }}
        run: |
          # Knopfdruck oder neuer Branch -> alles rendern.
          # Sonst nur die Skripte, die in diesem Push neu/geändert sind
          # (fertige Videos bleiben, auch wenn sich das Programm ändert).
          # Neuer Clip in ki_videos/NAME/ -> das Skript ki_videos/NAME.txt wird neu gerendert.
          if [ "$EREIGNIS" != "push" ] || ! git cat-file -e "$VORHER" 2>/dev/null; then
            ZIELE="$ORDNER"
          else
            ZIELE=$(git diff --name-only --diff-filter=AM "$VORHER" HEAD -- "$ORDNER" | while read -r f; do
              case "$f" in
                *.txt) echo "$f" ;;
                *.md) ;;
                *) d=$(echo "$f" | cut -d/ -f1-2); [ -f "$d.txt" ] && echo "$d.txt" ;;
              esac
            done | sort -u | tr '\n' ' ')
          fi
          echo "Rendere: ${ZIELE:-nichts}"
          echo "ziele=$ZIELE" >> "$GITHUB_OUTPUT"
      - name: Videos rendern
        if: steps.auswahl.outputs.ziele != ''
        run: python generator/make_video.py ${{ steps.auswahl.outputs.ziele }} --out videos
      - name: Videos zum Download bereitstellen
        if: always() && steps.auswahl.outputs.ziele != ''
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ matrix.ordner }}
          path: videos/
          retention-days: 30
      - name: Videos in den Ordner fertige_videos legen (direkt auf GitHub anschaubar)
        if: steps.auswahl.outputs.ziele != ''
        env:
          ORDNER: ${{ matrix.ordner }}
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p "fertige_videos/$ORDNER"
          cp videos/* "fertige_videos/$ORDNER/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fertige_videos
          git commit -q -m "Fertige Videos: $ORDNER" || { echo "Keine Änderungen"; exit 0; }
          # Mehrere Jobs laufen gleichzeitig -> bei Konflikt neu holen und nochmal versuchen
          for versuch in 1 2 3 4 5; do
            git pull -q --rebase origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && exit 0
            sleep $((versuch * 7))
          done
          exit 1
